name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
      DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      CORS_ORIGINS: http://localhost:5173
      REQUIRE_DB_TESTS: "1"
    steps:
      - name: Check the database secret is available
        run: |
          if [ -z "$DATABASE_URL_MIGRATIONS" ]; then
            echo "::error::The DATABASE_URL_MIGRATIONS secret is empty or missing. Add it under Settings > Secrets and variables > Actions > Repository secrets (not Variables, and not a fork's pull request)."
            exit 1
          fi
          echo "DATABASE_URL_MIGRATIONS is set."
      - uses: actions/checkout@v4

      # subsequent steps run inside backend
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: uv sync
        run: uv sync --frozen
        working-directory: backend

      - name: ruff check
        run: uv run ruff check .
        working-directory: backend

      - name: ruff format check
        run: uv run ruff format --check .
        working-directory: backend

      - name: mypy
        run: uv run mypy
        working-directory: backend

      - name: pytest
        run: uv run pytest --cov=app --cov-fail-under=80
        working-directory: backend

  frontend:
    name: Frontend (eslint, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
