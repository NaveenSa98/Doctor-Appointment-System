name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Tests use a throwaway test_<random> schema, so concurrent runs do not collide.
      # The same Supabase session-pooler URL serves the app settings and the migrations.
      DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
      DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      CORS_ORIGINS: http://localhost:5173
      # Fail (not skip) the database tests when the secret above is missing.
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=app --cov-fail-under=80

  frontend:
    name: Frontend (eslint, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
